name: Test basic query without variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          query: |
            query {
              license(key: "mit") {
                key
                name
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert data output
        env:
          ACTUAL: ${{ steps.action.outputs.data }}
        run: |
          echo "actual: $ACTUAL"
          NAME="$(node -e 'const d=JSON.parse(process.env.ACTUAL); console.log(d.license.name)')"
          KEY="$(node -e 'const d=JSON.parse(process.env.ACTUAL); console.log(d.license.key)')"
          echo "name: $NAME key: $KEY"
          if [ "$NAME" != "MIT License" ] || [ "$KEY" != "mit" ]; then
            echo "FAIL: expected MIT License / mit"
            exit 1
          fi
          echo "PASS"
