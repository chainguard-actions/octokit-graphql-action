name: Test invalid query fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          query: |
            query {
              thisFieldDoesNotExist12345 { nope }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DATA: ${{ steps.action.outputs.data }}
        run: |
          echo "outcome: $OUTCOME"
          echo "data: $DATA"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid query"
            exit 1
          fi
          if [ -n "$DATA" ]; then
            echo "FAIL: expected no data output"
            exit 1
          fi
          echo "PASS"
