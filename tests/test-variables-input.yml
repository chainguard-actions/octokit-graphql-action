name: Test query with YAML variables input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          query: |
            query release($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                name
                owner { login }
              }
            }
          variables: |
            owner: octokit
            repo: graphql-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert data output
        env:
          ACTUAL: ${{ steps.action.outputs.data }}
        run: |
          echo "actual: $ACTUAL"
          NAME="$(node -e 'const d=JSON.parse(process.env.ACTUAL); console.log(d.repository.name)')"
          OWNER="$(node -e 'const d=JSON.parse(process.env.ACTUAL); console.log(d.repository.owner.login)')"
          echo "name: $NAME owner: $OWNER"
          if [ "$NAME" != "graphql-action" ] || [ "$OWNER" != "octokit" ]; then
            echo "FAIL: expected octokit/graphql-action"
            exit 1
          fi
          echo "PASS"
